name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches package.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION" >&2
            exit 1
          fi
      - name: Create the draft release if it does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" || gh release create "$TAG" --draft --title "Luna Bot ${TAG#v}" --generate-notes
      - name: Build and upload the Windows installer as a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Creates a draft so a person publishes it after review. Installed apps only see published releases.
          EP_DRAFT: "true"
        run: bun run voice:prepare-runtime && bun run build && bunx electron-builder --win nsis --x64 --publish always

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
